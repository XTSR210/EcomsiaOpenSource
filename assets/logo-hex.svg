<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ecomsia">
  <!--
    Ecomsia hex monogram (vector version of the brand tile).
    Colors: dark navy #0b1220, teal accent #0ff1cf, ice #dff7ff.
  -->
  <defs>
    <linearGradient id="ecomsia-hex-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b" />
      <stop offset="1" stop-color="#070c15" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#ecomsia-hex-bg)" />
  <!-- faint orbit ring, like the brand tile -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="#0ff1cf" stroke-opacity="0.18" stroke-width="1.5" />
  <circle cx="90" cy="35" r="1.6" fill="#0ff1cf" fill-opacity="0.55" />
  <!-- hexagon -->
  <path
    d="M50 12 L83 31 L83 69 L50 88 L17 69 L17 31 Z"
    fill="none"
    stroke="#0ff1cf"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <!-- monogram E -->
  <g fill="#e9fdff">
    <rect x="41" y="35" width="7" height="30" rx="1.6" />
    <rect x="41" y="35" width="18" height="6.5" rx="1.6" />
    <rect x="41" y="46.75" width="15" height="6.5" rx="1.6" />
    <rect x="41" y="58.5" width="18" height="6.5" rx="1.6" />
  </g>
</svg>
